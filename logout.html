<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign out | UV Lab</title><script>if(localStorage.theme==='light')document.documentElement.classList.remove('dark')</script><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{inter:['Inter','sans-serif']},colors:{primary:'#0F172A',purpleMain:'#9A4CCA'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/style/app-pages.css"></head><body class="font-inter bg-gray-100 dark:bg-primary min-h-screen grid place-items-center text-gray-900 dark:text-white"><main class="bg-white dark:bg-gray-900 rounded-xl shadow-xl p-8 w-full max-w-md text-center"><img src="./assets/Logo.png" alt="UV Lab" class="h-10 mx-auto"><h1 class="text-xl font-bold mt-8">Sign out of UV Lab?</h1><p class="text-sm text-gray-500 mt-2">Your local dashboard session will be cleared.</p><div class="flex gap-2 mt-7"><a href="./index.html" class="flex-1 px-4 py-2.5 border rounded-lg text-sm">Stay signed in</a><button id="logout" class="flex-1 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold">Sign out</button></div><p id="done" class="hidden text-sm text-emerald-600 mt-5">You have been signed out. Redirecting...</p></main><script>document.querySelector('#logout').onclick=()=>{localStorage.removeItem('uvlab-crm-deals-v1');localStorage.removeItem('uvlab-crm-tasks');document.querySelector('#done').classList.remove('hidden');setTimeout(()=>location.href='./index.html',900)}</script></body></html>
